# Bakes every region in regions.json into PMTiles and publishes them as a
# release. The app streams https://github.com/<owner>/<repo>/releases/latest/download/<region>.pmtiles
# and reads manifest.json from the same place to know which regions exist.
name: Bake places

on:
  workflow_dispatch:
  schedule:
    # Monthly, after Overture's monthly release and a fresh AllThePlaces run.
    - cron: "17 4 3 * *"

permissions:
  contents: write

jobs:
  regions:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "names=$(python3 -c 'import json; print(json.dumps([r["name"] for r in json.load(open("regions.json"))]))')" >> "$GITHUB_OUTPUT"

  bake:
    needs: regions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ${{ fromJson(needs.regions.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq osmium-tool build-essential libsqlite3-dev zlib1g-dev
          curl -sfL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip && sudo mv duckdb /usr/local/bin/
          curl -sfL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/
          git clone -q --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -s -C /tmp/tippecanoe -j"$(nproc)" && sudo make -s -C /tmp/tippecanoe install
      - name: Bake ${{ matrix.region }}
        run: |
          read -r bbox osm < <(python3 -c '
          import json, sys
          r = next(r for r in json.load(open("regions.json")) if r["name"] == sys.argv[1])
          print(",".join(str(v) for v in r["bbox"]), r["osm"])' "${{ matrix.region }}")
          ./bake.sh "${{ matrix.region }}" "$bbox" "$osm" out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.region }}
          path: out/${{ matrix.region }}.pmtiles
          retention-days: 3

  publish:
    needs: bake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="places-$(date -u +%Y-%m-%d)"
          # The manifest names the dated release, so the app reads tiles one
          # redirect closer than through releases/latest.
          TAG="$tag" python3 - <<'PY'
          import json, os, datetime
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          regions = json.load(open("regions.json"))
          manifest = {
              "baked": datetime.date.today().isoformat(),
              "base": f"https://github.com/{repo}/releases/download/{tag}",
              "license": "ODbL 1.0, with data from OpenStreetMap contributors, All the Places and Overture Maps",
              "regions": [
                  {"name": r["name"], "bbox": r["bbox"], "file": r["name"] + ".pmtiles",
                   "bytes": os.path.getsize(f"out/{r['name']}.pmtiles")}
                  for r in regions if os.path.exists(f"out/{r['name']}.pmtiles")
              ],
          }
          json.dump(manifest, open("out/manifest.json", "w"), indent=1)
          PY
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/*.pmtiles out/manifest.json --latest \
            --title "Places $(date -u +%Y-%m-%d)" \
            --notes "Places merged from OpenStreetMap (ODbL), All the Places (CC0) and Overture Maps (CDLA Permissive 2.0). Shared under the Open Database License 1.0. © OpenStreetMap contributors."
          # Keep the three newest releases.
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' |
            xargs -r -n1 gh release delete --yes --cleanup-tag
